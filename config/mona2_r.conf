# Mouse config ---------------------
# 軸反転は mona2_r.overlay の input-processors で管理

# CONFIG_PMW3610_ALT_SWAP_XY=y
# BLE 輻輳軽減（83Hz 上限）
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y             # トラックボールデバッグログ
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300 # 起動時の安定化遅延（Troubleshooting 用）


# Encoder config -------------------
# Central 側にも設定が必要（split 通信用）

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y


# Battery config -------------------

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y


# ZMK Studio / DYA Studio config -------------------

CONFIG_ZMK_STUDIO=y
# DYA Studio では locking を無効にしない（BLE 接続に必要）
# CONFIG_ZMK_STUDIO_LOCKING=n

# BLE 接続スロット: Peripheral(1) + ホストプロファイル(4) = 5
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# DYA Studio モジュール（Central 側）

CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Settings RPC（アイドル/スリープ設定）
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Split イベントリレー（Central <-> Peripheral 設定同期）— cormoran/zmk フォークで提供
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# DYA Studio の追加処理に対応するためスタックサイズを拡大（デフォルト: 512）
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# Runtime Input Processor（トラックボール設定を DYA Studio から変更）
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Runtime Sensor Rotate（エンコーダの回転動作を DYA Studio から変更）
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# Watchdog（フリーズ、クラッシュ、予期しないリセットを記録し DYA Studio で一覧表示）
# ワークキューが 10 秒止まるとフリーズとして記録し、再起動する
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# Devtool（スレッドごとのスタック使用量を DYA Studio で表示）
CONFIG_ZMK_DEVTOOL=y
CONFIG_ZMK_DEVTOOL_STUDIO_RPC=y
CONFIG_ZMK_DEVTOOL_STACK_USAGE=y

# Custom Settings（Runtime Input Processor の設定を保存する基盤）
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

# カスタム RPC の通知をエンコードするスレッドのスタックとバッファ
# source: https://github.com/cormoran/zmk-keyboard-dya2/blob/main/boards/shields/dya2/dya2_right.conf
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256

# 設定の永続化（10秒デバウンス: Flash 摩耗と電源喪失時のデータロスのトレードオフ）
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000


# Bluetooth config -------------------
# 2M PHY 無効化による接続安定化（split 切断対策）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# TX 出力を最大に（0 dBm → +8 dBm）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 接続維持の強化（BLE 突然切断対策）
# supervision timeout 4s→6s
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600
# 全コネクションイベントに応答
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# Zephyr 4.1 は CONSOLE を既定で有効にするが、ZMK では使わない
# source: https://github.com/cormoran/zmk-keyboard-dya2/blob/main/boards/shields/dya2/dya2_right.conf
CONFIG_CONSOLE=n
