manifest:
  defaults:
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: sayu-hub
      url-base: https://github.com/sayu-hub
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: caksoylar
      url-base: https://github.com/caksoylar
    - name: zettaface
      url-base: https://github.com/zettaface
  projects:
    # ── Core ──────────────────────────────────────────────────────
    # ZMK: DYA Studio 用カスタム RPC サブシステム付き cormoran fork
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml

    # ── Widget ────────────────────────────────────────────────────
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3

    # ── Driver ────────────────────────────────────────────────────
    # トラックボール用ドライバー
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: zmk-0.3

    # ── DYA Studio モジュール（オプション: Studio UI 連携用）──────
    - name: zmk-module-ble-management
      remote: cormoran
      # main は ZMK v0.3 に無い zmk_endpoint_*_preferred_transport を参照しリンク不可
      revision: zmk-v0.3.0.0
    - name: zmk-module-battery-history
      remote: cormoran
      revision: 307755dd2ad4d320e14de162e8e5ef018f29d929
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: zmk-v0.3.0.0
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      # ZMK v0.3 では zmk_keymap_layer_activate が 1 引数。main は 2 引数呼び出しでビルド不可
      revision: zmk-v0.3.0.0
  self:
    path: config
